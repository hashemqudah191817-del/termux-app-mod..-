name: Build Termux APK

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Extract source code
      run: |
        mkdir -p extracted_code
        unzip -q termux-app-mod.zip -d extracted_code

    - name: Locate and Build APK
      run: |
        # البحث عن المجلد الذي يحتوي على gradlew في أي مكان والتحويل إليه تلقائياً
        GRADLEW_FILE=$(find extracted_code -name "gradlew" -type f -print -quit)
        if [ -z "$GRADLEW_FILE" ]; then
          echo "Error: gradlew file not found anywhere!"
          exit 1
        fi
        PROJECT_DIR=$(dirname "$GRADLEW_FILE")
        echo "Found gradlew in: $PROJECT_DIR"
        cd "$PROJECT_DIR"
        chmod +x gradlew
        ./gradlew assembleDebug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: termux-debug-apk
        path: extracted_code/**/build/outputs/apk/debug/*.apk
